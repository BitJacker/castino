name: Build e test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compila exe + MSI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Installa wixl (MSI builder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wixl

      - name: Versione
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=1.1.0" >> "$GITHUB_OUTPUT"; fi

      - name: Test + build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lindo
          path: |
            dist/Lindo.exe
            dist/Lindo.exe.config
            dist/LindoMonitor.exe
            dist/*.msi
            dist/*.zip

  windows:
    name: Prova reale su Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lindo
          path: dist

      - name: Installa l'MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "Installazione fallita ($($p.ExitCode))" }
          if (-not (Test-Path "$env:ProgramFiles\Lindo\Lindo.exe")) { throw "Lindo.exe non installato" }
          $entry = Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'Lindo'
          if (-not $entry) { throw "Lindo non compare tra le app installate" }
          "Installato: $($entry.DisplayName) $($entry.DisplayVersion)"

      - name: Autotest (legge le app reali, non elimina nulla)
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\Lindo\Lindo.exe" -ArgumentList "--selftest `"$pwd\selftest.txt`"" -Wait -PassThru
          Get-Content selftest.txt | Select-String -Pattern '^(PASS|FAIL|RISULTATO|ORFANI|RESIDUI|PULIZIA|App Store|Roots)' | Select-Object -First 200
          if ($p.ExitCode -ne 0) { Get-Content selftest.txt | Select-String FAIL; throw "Autotest fallito" }

      - name: Installa 20+ app vere e strumenti per sviluppatori (banco di prova)
        shell: pwsh
        run: |
          $apps = '7zip','vlc','notepadplusplus','putty','winscp','filezilla','keepass','sumatrapdf','audacity','greenshot',
                  'irfanview','everything','peazip','qbittorrent','treesizefree','cpu-z','crystaldiskinfo','windirstat','autohotkey','hwinfo'
          foreach ($a in $apps) {
            choco install $a -y --no-progress --limit-output | Out-Null
            "{0,-18} exit {1}" -f $a, $LASTEXITCODE
          }
          # Strumenti che NON compaiono tra le app installate ma non vanno mai toccati
          npm install -g cowsay --silent
          python -m pip install --user --quiet requests
          $npmPrefix = (npm prefix -g).Trim()
          "NPM_PREFIX=$npmPrefix" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude" | Out-Null
          # Cartelle di strumenti VECCHIE (un anno) che non risultano installate: non devono MAI essere "sicure"
          $old = (Get-Date).AddYears(-1)
          foreach ($t in @("$env:APPDATA\npm", "$env:LOCALAPPDATA\npm-cache", "$env:APPDATA\Claude", "$env:LOCALAPPDATA\AnthropicClaude", "$env:LOCALAPPDATA\pip", "$env:APPDATA\Code", "$env:LOCALAPPDATA\Docker")) {
            New-Item -ItemType Directory -Force $t | Out-Null
            Set-Content "$t\dati.json" '{}'
            Get-ChildItem $t -Recurse -Force | ForEach-Object { $_.LastWriteTime = $old }
            (Get-Item $t).LastWriteTime = $old
          }

      - name: Crea residui finti (vecchi di un anno)
        shell: pwsh
        run: |
          $old = (Get-Date).AddYears(-1)
          $fake = @("$env:ProgramFiles\VecchioProgrammaTest", "$env:APPDATA\VecchiaAppTest", "$env:LOCALAPPDATA\VecchiaCacheTest", "$env:ProgramData\VecchioServizioTest")
          foreach ($f in $fake) {
            New-Item -ItemType Directory -Force "$f\sub" | Out-Null
            Set-Content "$f\dati.bin" ("x" * 200000)
            Set-Content "$f\sub\config.ini" "[a]"
            Get-ChildItem $f -Recurse -Force | ForEach-Object { $_.LastWriteTime = $old }
            (Get-Item $f).LastWriteTime = $old
          }
          "EXPECT=$($fake -join ';')" | Out-File -Append $env:GITHUB_ENV

      - name: Verifica di sicurezza dei residui
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\Lindo\Lindo.exe" -ArgumentList "--safety-test `"$pwd\safety.txt`" --expect `"$env:EXPECT`"" -Wait -PassThru
          Get-Content safety.txt
          if ($p.ExitCode -ne 0) { throw "Verifica di sicurezza fallita" }

      - name: Verifica informativa (ignorando la data di modifica)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process "$env:ProgramFiles\Lindo\Lindo.exe" -ArgumentList "--safety-test `"$pwd\safety-0days.txt`" --expect `"$env:EXPECT`" --recent-days 0" -Wait -PassThru
          Get-Content safety-0days.txt | Select-String -Pattern '^(SICURI|FAIL|RISULTATO|    )' | Select-Object -First 80

      - name: Schermate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs\screenshots | Out-Null
          $p = Start-Process "$env:ProgramFiles\Lindo\Lindo.exe" -ArgumentList "--screenshot `"$pwd\docs\screenshots`"" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "Timeout schermate" }
          Get-ChildItem docs\screenshots
          if ((Get-ChildItem docs\screenshots\*.png).Count -lt 8) { Get-Content "$env:LOCALAPPDATA\Lindo\lindo.log" -ErrorAction SilentlyContinue; throw "Schermate mancanti" }

      - name: Robot che usa Lindo come una persona e verifica tutto
        shell: powershell
        timeout-minutes: 40
        run: |
          $survive = "$env:NPM_PREFIX;$env:APPDATA\npm;$env:LOCALAPPDATA\npm-cache;$env:APPDATA\Claude;$env:USERPROFILE\.claude;$env:LOCALAPPDATA\AnthropicClaude;$env:ProgramFiles\Git"
          & .\tests\gui\robot.ps1 -Out "$PWD\docs\test-robot" -ExpectOrphans $env:EXPECT -MustSurvive $survive
          $code = $LASTEXITCODE
          node --version; npm --version; git --version; python --version
          cowsay "Lindo non ha rotto nulla"
          if ($LASTEXITCODE -ne 0) { Write-Host "npm globale non funziona più"; $code++ }
          exit $code

      - name: Disinstalla l'MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Disinstallazione fallita ($($p.ExitCode))" }
          if (Test-Path "$env:ProgramFiles\Lindo\Lindo.exe") { throw "Lindo.exe ancora presente" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risultati-windows
          path: |
            selftest.txt
            safety.txt
            safety-0days.txt
            uninstall.txt
            install.log
            docs/screenshots/*.png
            docs/test-robot/*

      - name: Salva le schermate nel repository
        if: always() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png docs/test-robot
          if git diff --cached --quiet; then echo "Nessuna schermata nuova"; exit 0; fi
          git commit -m "Aggiorna le schermate del README [skip ci]"
          # Se nel frattempo è arrivato un altro commit, le schermate di questo giro hanno la precedenza
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  release:
    name: Pubblica la release
    needs: [build, windows]
    # Pubblica dopo che la prova su Windows è passata (push sul ramo o tag v*)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lindo
          path: dist
      - name: Nome della versione
        id: ver
        run: |
          msi=$(ls dist/*.msi); v=$(basename "$msi" .msi); echo "version=${v#Lindo-}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lindo ${{ steps.ver.outputs.version }}
          make_latest: "true"
          body: |
            **Scarica uno dei due file qui sotto (sezione Assets):**

            - `Lindo-${{ steps.ver.outputs.version }}.msi`: installazione classica (menu Start, Desktop, compare tra le app installate).
            - `Lindo-${{ steps.ver.outputs.version }}-portatile.zip`: versione portatile completa (con il monitor in background).
            - `Lindo.exe`: solo l'app, senza il monitor in background.

            Requisiti: Windows 10 (1903 o successivo) o Windows 11. Se compare "PC protetto da Windows",
            clicca *Ulteriori informazioni → Esegui comunque* (l'eseguibile non è firmato digitalmente).
          files: |
            dist/*.msi
            dist/*.zip
            dist/Lindo.exe
