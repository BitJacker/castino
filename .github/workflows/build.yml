name: Build e test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compila exe + MSI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Installa wixl (MSI builder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wixl

      - name: Versione
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=1.0.0" >> "$GITHUB_OUTPUT"; fi

      - name: Test + build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lindo
          path: |
            dist/Lindo.exe
            dist/Lindo.exe.config
            dist/*.msi

  windows:
    name: Prova reale su Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lindo
          path: dist

      - name: Installa l'MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "Installazione fallita ($($p.ExitCode))" }
          if (-not (Test-Path "$env:ProgramFiles\Lindo\Lindo.exe")) { throw "Lindo.exe non installato" }
          $entry = Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'Lindo'
          if (-not $entry) { throw "Lindo non compare tra le app installate" }
          "Installato: $($entry.DisplayName) $($entry.DisplayVersion)"

      - name: Autotest (legge le app reali, non elimina nulla)
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\Lindo\Lindo.exe" -ArgumentList "--selftest `"$pwd\selftest.txt`"" -Wait -PassThru
          Get-Content selftest.txt | Select-String -Pattern '^(PASS|FAIL|RISULTATO|ORFANI|RESIDUI|PULIZIA|App Store|Roots)' | Select-Object -First 200
          if ($p.ExitCode -ne 0) { Get-Content selftest.txt | Select-String FAIL; throw "Autotest fallito" }

      - name: Schermate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs\screenshots | Out-Null
          $p = Start-Process "$env:ProgramFiles\Lindo\Lindo.exe" -ArgumentList "--screenshot `"$pwd\docs\screenshots`"" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "Timeout schermate" }
          Get-ChildItem docs\screenshots
          if ((Get-ChildItem docs\screenshots\*.png).Count -lt 4) { Get-Content "$env:LOCALAPPDATA\Lindo\lindo.log" -ErrorAction SilentlyContinue; throw "Schermate mancanti" }

      - name: Disinstalla l'MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Disinstallazione fallita ($($p.ExitCode))" }
          if (Test-Path "$env:ProgramFiles\Lindo\Lindo.exe") { throw "Lindo.exe ancora presente" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risultati-windows
          path: |
            selftest.txt
            install.log
            docs/screenshots/*.png

      - name: Salva le schermate nel repository
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then echo "Nessuna schermata nuova"; exit 0; fi
          git commit -m "Aggiorna le schermate del README [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  release:
    name: Pubblica la release
    needs: [build, windows]
    # Pubblica dopo che la prova su Windows è passata (push sul ramo o tag v*)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lindo
          path: dist
      - name: Nome della versione
        id: ver
        run: |
          msi=$(ls dist/*.msi); v=$(basename "$msi" .msi); echo "version=${v#Lindo-}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lindo ${{ steps.ver.outputs.version }}
          make_latest: "true"
          body: |
            **Scarica uno dei due file qui sotto (sezione Assets):**

            - `Lindo-${{ steps.ver.outputs.version }}.msi`: installazione classica (menu Start, Desktop, compare tra le app installate).
            - `Lindo.exe`: versione portatile, si avvia senza installare nulla.

            Requisiti: Windows 10 (1903 o successivo) o Windows 11. Se compare "PC protetto da Windows",
            clicca *Ulteriori informazioni → Esegui comunque* (l'eseguibile non è firmato digitalmente).
          files: |
            dist/Lindo.exe
            dist/*.msi
